# [함수 5] 관련 기업 및 경제 원리 리서치 (★ 핵심 추가)
# =========================================================
def research_economy_and_companies(news_title, article_content):
    """뉴스 주제에 대한 경제 원리 + 관련 기업 분석"""
    print("🔬 AI가 경제 원리 및 관련 기업 리서치 중...")
    url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_NAME}:generateContent?key={GEMINI_API_KEY}"
    
    context = f"기사 내용: {article_content[:1500]}" if article_content else f"제목만 있음: {news_title}"
    
    prompt = f"""
    다음 경제/금융 뉴스를 분석하여 독자들이 알아야 할 정보를 정리해줘.
    
    {context}
    
    다음 항목들을 각각 2-3문장으로 요약해줘:
    1. 핵심 경제 원리: 이 뉴스와 관련된 경제학 개념 (금리, 인플레이션, 공급망, 환율, 양적완화 등)
    2. 관련 미국 기업: 이 뉴스와 직접 연관된 미국 기업 1-2개 (티커 심볼 포함, 예: Apple(AAPL))
    3. 관련 한국 기업: 이 뉴스와 직접 연관된 한국 기업 1-2개 (티커 심볼 포함, 예: 삼성전자(005930.KS))
    4. 시장 전망: 전문가들의 의견이나 향후 예상되는 시장 변화
    
    JSON 형식으로만 출력:
    {{
      "economic_principle": "...",
      "us_companies": ["Apple(AAPL)", "Microsoft(MSFT)"],
      "kr_companies": ["삼성전자(005930.KS)", "SK하이닉스(000660.KS)"],
      "market_outlook": "..."
    }}
    """
    
    try:
        payload = {
            "contents": [{"parts": [{"text": prompt}]}],
            "generationConfig": {"temperature": 0.5}
        }
        res = requests.post(url, json=payload, headers={'Content-Type': 'application/json'})
        
        if res.status_code == 200:
            raw_text = res.json()['candidates'][0]['content']['parts'][0]['text']
            json_match = re.search(r'\{.*\}', raw_text, re.DOTALL)
            if json_match:
                research_data = json.loads(json_match.group())
                print("✅ 리서치 완료")
                return research_data
    except Exception as e:
        print(f"⚠️ 리서치 실패: {e}")
    
    return None

# =========================================================
# [함수 6] 기업 재무 정보 수집 (★ 핵심 추가)
# =========================================================
def get_company_financials(companies_list):
    """yfinance를 사용하여 기업의 시가총액, 주가, 주력 사업 정보 수집"""
    print("💼 관련 기업들의 재무 정보 수집 중...")
    
    company_data = []
    
    for company_str in companies_list:
        try:
            # "삼성전자(005930.KS)" 형식에서 티커 추출
            ticker_match = re.search(r'\(([^)]+)\)', company_str)
            if not ticker_match:
                continue
                
            ticker = ticker_match.group(1)
            company_name = company_str.split('(')[0].strip()
            
            print(f"  📈 {company_name} ({ticker}) 데이터 수집 중...")
            
            stock = yf.Ticker(ticker)
            info = stock.info
            
            # 시가총액 (원화 변환 고려)
            market_cap = info.get('marketCap', 0)
            if market_cap:
                if 'KS' in ticker:  # 한국 기업
                    market_cap_display = f"{market_cap / 1_000_000_000_000:.1f}조원"
                else:  # 미국 기업
                    market_cap_display = f"${market_cap / 1_000_000_000:.1f}B"
            else:
                market_cap_display = "N/A"
            
            # 현재 주가
            current_price = info.get('currentPrice', 0)
            if not current_price:
                hist = stock.history(period="1d")
                current_price = hist['Close'].iloc[-1] if len(hist) > 0 else 0
            
            # 주력 사업 (비즈니스 섹터)
            sector = info.get('sector', 'N/A')
            industry = info.get('industry', 'N/A')
            business_summary = info.get('longBusinessSummary', '')[:200] if info.get('longBusinessSummary') else 'N/A'
            
            company_data.append({
                'name': company_name,
                'ticker': ticker,
                'price': f"${current_price:.2f}" if current_price else "N/A",
                'market_cap': market_cap_display,
                'sector': sector,
                'industry': industry,
                'summary': business_summary
            })
            
            print(f"  ✅ {company_name}: 시총 {market_cap_display}, 주가 ${current_price:.2f}")
            
        except Exception as e:
            print(f"  ⚠️ {company_str} 정보 수집 실패: {e}")
            continue
    
    return company_data

