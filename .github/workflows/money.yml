# [함수 11] 심층 분석 본문 작성 (★ 대폭 강화)
# =========================================================
def generate_deep_content(news, image_urls, dashboard_html, article_content=None, research_data=None, company_data=None):
    print("🧠 경제 원리 + 기업 분석 칼럼 작성 중...")
    url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_NAME}:generateContent?key={GEMINI_API_KEY}"
    
    # 리서치 데이터 통합
    research_section = ""
    if research_data:
        research_section = f"""
[참고할 배경 지식]
- 경제 원리: {research_data.get('economic_principle', 'N/A')}
- 관련 미국 기업: {', '.join(research_data.get('us_companies', []))}
- 관련 한국 기업: {', '.join(research_data.get('kr_companies', []))}
- 시장 전망: {research_data.get('market_outlook', 'N/A')}
"""

    article_section = f"""
[원문 기사 내용]
{article_content[:1500]}
""" if article_content else ""

    # 기업 정보 텍스트 요약
    company_summary = ""
    if company_data:
        company_summary = "\n[관련 기업 정보]\n"
        for company in company_data:
            company_summary += f"- {company['name']}: 시총 {company['market_cap']}, 주가 {company['price']}, {company['sector']} 섹터\n"

    prompt = f"""
    당신은 10년 경력의 경제/금융 전문 칼럼니스트입니다.
    아래 뉴스를 단순 요약이 아닌, **경제 원리 해설 + 관련 기업 심층 분석** 칼럼으로 작성하세요.

    [뉴스 기본 정보]
    제목: {news.title}
    링크: {news.link}
    
    {article_section}
    
    {research_section}
    
    {company_summary}
    
    [작성 가이드]
    1. **경제 원리 해설**: 뉴스 속 경제 개념(금리, 인플레이션, 공급망 등)을 쉽게 설명
    2. **기업 연결**: 이 뉴스가 관련 기업들에게 어떤 영향을 미치는지 분석
    3. **재무 현황**: 관련 기업들의 시가총액, 주력 사업, 수익 구조 설명
    4. **투자 인사이트**: 독자가 이 정보를 어떻게 활용할 수 있는지 제시
    5. **비판적 시각**: 리스크와 우려 사항도 공정하게 다룸
    
    [HTML 구조]
    [[DASHBOARD]]
    
    <h2>🔥 [도발적인 소제목]</h2>
    <p>[후킹: 독자의 돈과 관련된 질문 - 3문장]</p>
    
    [[IMAGE_1]]
    
    <h2>📚 경제 원리 해부: [핵심 개념]이란?</h2>
    <p>[경제 개념을 일상 비유로 쉽게 설명 - 5문장 이상]</p>
    <ul>
      <li>핵심 포인트 1</li>
      <li>핵심 포인트 2</li>
      <li>핵심 포인트 3</li>
    </ul>
    
    <h2>🏢 주목해야 할 기업들</h2>
    <p>[관련 기업들이 왜 중요한지, 이 뉴스가 기업에 미치는 영향 - 4문장 이상]</p>
    
    [[COMPANY_CARDS]]
    
    [[IMAGE_2]]
    
    <h2>💰 투자자 관점: 이 정보를 어떻게 활용할까</h2>
    <p>[구체적인 투자 인사이트, 주의할 점 - 4문장 이상]</p>
    
    <h2>⚠️ 주의해야 할 리스크</h2>
    <p>[비판적 분석 - 불확실성, 리스크 요인 - 3문장 이상]</p>
    
    <p><strong>결론:</strong> [한 문장 정리]</p>
    <hr>
    <p style="color:grey; font-size:0.8em; text-align:center;">📰 출처: <a href="{news.link}">{news.title}</a></p>
    <p style="color:grey; font-size:0.8em; text-align:center;">⚠️ 본 글은 투자 권유가 아니며, 투자 판단의 책임은 투자자 본인에게 있습니다.</p>
    
    [필수 규칙]
    - HTML 태그만 출력 (```html 블록 절대 금지)
    - 해요체 사용
    - 전문 용어는 반드시 괄호로 쉽게 풀이
    - 각 섹션마다 최소 3문장 이상 작성
    - [[IMAGE_1]], [[IMAGE_2]], [[COMPANY_CARDS]], [[DASHBOARD]]는 정확히 그대로 출력
    """
    
    payload = {
        "contents": [{"parts": [{"text": prompt}]}], 
        "generationConfig": {
            "temperature": 0.6,
            "topP": 0.9,
            "topK": 40,
            "maxOutputTokens": 2048
        }
    }
    
    for attempt in range(3):
        try:
            res = requests.post(url, json=payload, headers={'Content-Type': 'application/json'})
            if res.status_code == 200:
                raw_text = res.json()['candidates'][0]['content']['parts'][0]['text']
                clean_text = clean_markdown(raw_text.replace("```html", "").replace("```", "").strip())
                
                # 1. 대시보드 교체
                final_content = clean_text.replace("[[DASHBOARD]]", dashboard_html)
                
                # 2. 이미지 태그 주입
                img1_tag = f'<img src="{image_urls[0]}" style="width:100%; border-radius:12px; margin:25px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">' if len(image_urls) > 0 else ""
                img2_tag = f'<img src="{image_urls[1]}" style="width:100%; border-radius:12px; margin:25px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">' if len(image_urls) > 1 else img1_tag
                
                final_content = final_content.replace("[[IMAGE_1]]", img1_tag)
                final_content = final_content.replace("[[IMAGE_2]]", img2_tag)
                
                # 3. 기업 카드 주입
                company_cards_html = generate_company_cards_html(company_data) if company_data else ""
                final_content = final_content.replace("[[COMPANY_CARDS]]", company_cards_html)
                
                # 너무 짧으면 재시도
                if len(final_content) < 500:
                    print(f"⚠️ 글이 너무 짧음 ({len(final_content)}자), 재시도...")
                    time.sleep(3)
                    continue
                
                return final_content
                
            elif res.status_code == 429:
                print("⏳ Rate limit, 30초 대기...")
                time.sleep(30)
        except Exception as e:
            print(f"❌ 시도 {attempt+1} 실패: {e}")
            time.sleep(5)
    
    return None

# =========================================================
# [함수 12] 제목 생성
# =========================================================
def generate_viral_title(news_title):
    url = f"https://generativelanguage.googleapis.com/v1beta/models/{MODEL_NAME}:generateContent?key={GEMINI_API_KEY}"
    
    prompt = f"""
    뉴스 제목: '{news_title}'
    
    이 글의 블로그 제목을 딱 1개만 지어주세요.
    
    [절대 규칙]
    1. 후보 리스트(1번, 2번...)를 절대 만들지 마세요.
    2. 부가 설명 없이 오직 '제목 텍스트 한 줄'만 출력하세요.
    3. 따옴표("), 별표(*) 특수문자 절대 사용 금지.
    
    [스타일]
    경제/금융 이슈를 다루되, 독자의 관심을 끄는 질문이나 도발적 문구 활용.
    """
    
    try:
        res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]}, headers={'Content-Type': 'application/json'})
        title = res.json()['candidates'][0]['content']['parts'][0]['text'].strip()
        
        clean_title = title.split('\n')[0]
        clean_title = clean_title.replace('"', '').replace("'", "").replace("**", "").replace("*", "")
        clean_title = clean_title.replace("제목:", "").strip()
        
        return clean_title
    except:
        return news_title

