def run_bot():
    print("▶️ 경제 심층 분석 봇 v5.0 시작")
    try:
        creds = Credentials.from_authorized_user_info(TOKEN_JSON)
        service = build('blogger', 'v3', credentials=creds)

        news_list = get_business_news_list()
        if not news_list:
            print("❌ 뉴스 없음")
            return

        target_news = None
        for news in news_list:
            print(f"\n{'='*60}")
            print(f"🔎 검토 중: {news.title}")
            if check_is_duplicate(service, news.title):
                print("🚫 중복 - 스킵")
                continue
            else:
                target_news = news
                break
        
        if not target_news:
            print("😴 새 뉴스 없음")
            return

        print(f"\n{'='*60}")
        print(f"✅ 선택됨: {target_news.title}")
        print(f"{'='*60}\n")

        # ★★★ 핵심 파이프라인 ★★★
        # 1단계: 원문 크롤링
        article_content = fetch_article_content(target_news.link)
        
        # 2단계: 경제 원리 + 기업 리서치
        research_data = research_economy_and_companies(target_news.title, article_content)
        
        # 3단계: 기업 재무 정보 수집
        company_data = []
        if research_data:
            all_companies = research_data.get('us_companies', []) + research_data.get('kr_companies', [])
            company_data = get_company_financials(all_companies)
        
        # 4단계: 이미지 검색
        keywords = get_search_keywords(target_news.title)
        images = get_relevant_images_webp(keywords)
        
        # 5단계: 대시보드 생성
        dashboard = get_dashboard_html()
        
        # 6단계: 심층 칼럼 작성
        content = generate_deep_content(
            target_news,
            images,
            dashboard,
            article_content,
            research_data,
            company_data
        )
        
        if not content:
            print("❌ 글 작성 실패")
            return

        # 7단계: 제목 생성 및 업로드
        title = generate_viral_title(target_news.title)
        print(f"\n📤 최종 제목: {title}")
        
        body = {"kind": "blogger#post", "title": title, "content": content}
        service.posts().insert(blogId=BLOG_ID, body=body).execute()
        print(f"\n🎉 포스팅 완료!")
        print(f"📝 제목: {title}")
        print(f"📏 본문 길이: {len(content)}자")
        print(f"🏢 분석한 기업 수: {len(company_data)}개")

    except Exception as e:
        print(f"⛔ 치명적 오류: {e}")
        import traceback
        traceback.print_exc()
        exit(1)

if __name__ == "__main__":
    run_bot()
