# [함수 10] 기업 카드 HTML 생성
# =========================================================
def generate_company_cards_html(company_data):
    """기업 정보를 보기 좋은 카드 형태로 HTML 생성"""
    if not company_data:
        return ""
    
    cards_html = '<div style="display: flex; flex-wrap: wrap; gap: 15px; margin: 25px 0;">'
    
    for company in company_data:
        card = f"""
        <div style="flex: 1 1 calc(50% - 15px); min-width: 250px; background: #f8f9fa; border-radius: 12px; padding: 20px; border-left: 4px solid #0984e3;">
            <h3 style="margin: 0 0 10px 0; color: #2d3436; font-size: 18px;">{company['name']}</h3>
            <p style="margin: 5px 0; color: #636e72; font-size: 13px;"><b>티커:</b> {company['ticker']}</p>
            <p style="margin: 5px 0; color: #636e72; font-size: 13px;"><b>현재가:</b> {company['price']}</p>
            <p style="margin: 5px 0; color: #636e72; font-size: 13px;"><b>시가총액:</b> {company['market_cap']}</p>
            <p style="margin: 5px 0; color: #636e72; font-size: 13px;"><b>섹터:</b> {company['sector']}</p>
            <p style="margin: 5px 0; color: #636e72; font-size: 13px;"><b>산업:</b> {company['industry']}</p>
            <p style="margin: 10px 0 0 0; color: #2d3436; font-size: 12px; line-height: 1.5;">{company['summary']}</p>
        </div>
        """
        cards_html += card
    
    cards_html += '</div>'
    return cards_html

